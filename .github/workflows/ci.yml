      # TR: Ham loglar giriş yapmış kullanıcı ister; uyarılar (annotation) ve iş özeti istemez. Böylece bir hata, testlerinin
      #     adını herkesin (ve her aracın) okuyabileceği yerde söyler (T-043).
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: ./eng/ci/Report-FailedTests.ps1 -ResultsDirectory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ubuntu-26-${{ matrix.attempt }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore
