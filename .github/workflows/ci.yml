        run: |
          dotnet dev-certs https --trust || echo "::notice::dev-certs reported partial trust (expected on Linux)"
          test -n "$(ls -A "$HOME/.aspnet/dev-certs/trust")"
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore MyWorkplace.slnx

      - name: Build
        run: dotnet build MyWorkplace.slnx --no-restore --configuration Release

      # EN: Test projects run one after another: several of them start containers, and starting them in parallel can
      #     lose a port race ("address already in use", T-051). Costs little; the cause is gone rather than retried
      #     (ADR-028).
      # TR: Test projeleri art arda çalışır: birkaçı konteyner başlatır ve onları paralel başlatmak bir port yarışını kaybedebilir
      #     ("address already in use", T-051). Maliyeti az; neden yeniden denenmek yerine ortadan kalkar (ADR-028).
      - name: Test
        run: >-
          dotnet test --solution MyWorkplace.slnx --no-build --configuration Release
          --max-parallel-test-modules 1
          --report-xunit-trx --results-directory TestResults

      # EN: Raw logs need a signed-in user; annotations and the job summary don't. So a failure names its tests
